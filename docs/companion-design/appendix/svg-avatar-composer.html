<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>咪兔 SVG 图层组合器 — v3-exact</title>
<style>
:root{--bg:#1a1a1a;--surface:#252525;--border:#333;--ink:#ccc;--mute:#888;--accent:#ff9f43;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,monospace;display:flex;height:100vh;overflow:hidden}
#sidebar{width:300px;min-width:300px;background:var(--surface);border-right:1px solid var(--border);padding:20px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
h2{font-size:13px;color:var(--accent);letter-spacing:1px;border-bottom:1px solid var(--border);padding-bottom:6px}
.panel{display:flex;flex-direction:column;gap:4px}
.panel label{font-size:10px;color:var(--mute);letter-spacing:.5px;text-transform:uppercase}
.panel select,.panel button{background:var(--bg);border:1px solid var(--border);color:var(--ink);padding:7px 10px;border-radius:4px;font-size:12px;font-family:inherit;cursor:pointer;outline:none}
.panel select:focus{border-color:var(--accent)}
.shiny-row{display:flex;align-items:center;gap:10px}
.shiny-row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.actions{display:flex;gap:8px;margin-top:8px}
.actions button{flex:1;padding:8px 12px;border-radius:4px;border:1px solid var(--border);cursor:pointer;font-size:11px;font-family:inherit}
.btn-random{background:#2a2a3a;color:#aac}.btn-random:hover{background:#3a3a4a}
.btn-export{background:#2a3a2a;color:#8c8}.btn-export:hover{background:#3a4a3a}
.stats{font-size:10px;color:var(--mute);text-align:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--border)}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px}
#preview-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px 32px;image-rendering:pixelated}
#preview-box svg{display:block}
#svg-output{width:600px;max-width:90%;height:120px;background:var(--surface);border:1px solid var(--border);border-radius:4px;color:var(--mute);font-family:monospace;font-size:10px;padding:10px;resize:none;outline:none}
#svg-output:focus{border-color:var(--accent)}
.copied{color:#8c8;font-size:11px;opacity:0;transition:opacity .2s}.copied.show{opacity:1}
</style></head>
<body>
<div id="sidebar">
<h2>◈ 咪兔图层组合器</h2>
<div class="panel"><label>品种 Breed</label><select id="sel-breed">
<option value="orange_tabby">橘猫 orange_tabby</option><option value="tuxedo">奶牛猫 tuxedo</option>
<option value="calico">三花猫 calico</option><option value="siamese">暹罗猫 siamese</option>
<option value="black_cat">黑猫 black_cat</option><option value="ragdoll">布偶猫 ragdoll</option>
<option value="scottish_fold">折耳猫 scottish_fold</option></select></div>
<div class="panel"><label>眼睛 Eye</label><select id="sel-eye">
<option value="dot">· dot</option><option value="sparkle">✦ sparkle</option>
<option value="big">◉ big</option><option value="round">o round</option>
<option value="heart">♥ heart</option><option value="star">☆ star</option></select></div>
<div class="panel"><label>耳朵 Ear</label><select id="sel-ear">
<option value="cat">cat 猫耳</option><option value="rabbit">rabbit 兔耳</option><option value="mix">mix 混合</option></select></div>
<div class="panel"><label>帽子 Hat</label><select id="sel-hat">
<option value="none">无</option><option value="crown">👑 皇冠</option><option value="tophat">🎩 礼帽</option>
<option value="propeller">🔄 竹蜻蜓</option><option value="halo">😇 光环</option>
<option value="wizard">🧙 巫师帽</option><option value="beanie">🧶 毛线帽</option><option value="tinyduck">🦆 小鸭子</option></select></div>
<div class="panel"><label>色板 Palette</label><select id="sel-palette">
<option value="default">默认 (品种本色)</option><option value="warm">暖橘</option><option value="cool">冷灰</option>
<option value="cream">奶油</option><option value="charcoal">炭黑</option><option value="snow">雪白</option></select></div>
<div class="panel"><div class="shiny-row"><input type="checkbox" id="sel-shiny"><label style="margin:0">闪亮 ✦</label></div></div>
<div class="actions"><button class="btn-random" onclick="randomize()">🎲 随机</button><button class="btn-export" onclick="copySVG()">📋 复制 SVG</button></div>
<div class="stats">数据源: v3 精细像素 (100% 还原)</div></div>
<div id="main">
<div id="preview-box"></div><span class="copied" id="copied-msg">已复制!</span>
<textarea id="svg-output" readonly placeholder="SVG 代码..."></textarea></div>

// Eye types — v3 style: whites fill → 2×2 iris → 1×2 pupil → single highlight
// Each takes box {x,y,w,h} + base color (may be non-white for black_cat)
const EYE = {
  dot:(b,bg)=>{ // v3 natural eye — 2×2 iris + pupil right + 1 highlight top
    const iy=b.h<=2?b.y:b.y+1, ih=2;
    return [
    {x:b.x,y:b.y,w:b.w,h:b.h,fill:bg||'#fff'},
    {x:b.x+1,y:iy,w:2,h:ih,fill:'#38B149'},
    {x:b.x+2,y:iy,w:1,h:ih,fill:'#000'},
    {x:b.x+1,y:b.y,w:1,h:1,fill:'#fff'},
  ];},
  sparkle:(b,bg)=>{ // golden shimmer
    const iy=b.h<=2?b.y:b.y+1, ih=2;
    return [
    {x:b.x,y:b.y,w:b.w,h:b.h,fill:bg||'#fff'},
    {x:b.x+1,y:iy,w:2,h:ih,fill:'#FFC840'},
    {x:b.x+2,y:iy,w:1,h:ih,fill:'#aa7700'},
    {x:b.x+1,y:b.y,w:1,h:1,fill:'#fff'},
    {x:b.x,y:b.y,w:1,h:1,fill:'#FFF8A0'},
    {x:b.x+b.w-1,y:b.y+b.h-1,w:1,h:1,fill:'#FFF8A0'},

  big:(b,bg)=>[ // expressive — larger dark iris with 3 catchlights
    {x:b.x,y:b.y,w:b.w,h:b.h,fill:bg||'#fff'},

// ═══════════════ RENDER ═══════════════
function R(g,x,y,w,h,fill){return{g:g||'',x,y,w,h,fill};}
const NS='http://www.w3.org/2000/svg';
function el(t,a){const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e;}

function build(breed,eyeType,earType,hatName,palKey,shiny){
  const svg=el('svg',{width:'240',height:'272',viewBox:'0 -14 32 46','shape-rendering':'crispEdges'});
  const data=V3[breed];
  const rects=data.rects;
  const[es,ee]=data.earIdx; const[is,ie]=data.eyeIdx;

  // palette
  let bC=data.colors.B, dC=data.colors.D;
  if(palKey!=='default'){const p=PAL[palKey](); bC=p.B; dC=p.D;}

  // Render body (skip ear + eye ranges)
  for(let i=0;i<rects.length;i++){
    if(i>=es&&i<=ee)continue; // skip ears
    if(i>=is&&i<=ie)continue; // skip eyes
    const r=rects[i]; let f=r.fill;
    // remap main breed colors
    if(f===data.colors.B)f=bC; else if(f===data.colors.D)f=dC;
    svg.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:f}));
  }

  // Ear overlay
  const earG=el('g',{});
  const earRects=EAR[earType](bC,dC,bC+'80'); // light = body + alpha-ish (use body for simplicity)
  earRects.forEach(r=>earG.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:r.fill===(bC+'80')?bC:r.fill})));
  svg.appendChild(earG);

  // Eye overlay: use BOTH eye boxes from v3 data
  const leftBox = rects[is];
  const rightBox = rects[is+1] || {x:leftBox.x+10,y:leftBox.y,w:leftBox.w,h:leftBox.h,fill:leftBox.fill};
  const eyeBG = leftBox.fill; // black_cat has yellow (#FFC840), others white
  const eyeG=el('g',{});
  [leftBox, rightBox].forEach(box=>{
    EYE[eyeType](box, eyeBG).forEach(r=>eyeG.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:r.fill})));
  });
  svg.appendChild(eyeG);

  // Hat
  const hatG=el('g',{});
  HAT[hatName]().forEach(r=>hatG.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,fill:r.fill})));
  svg.appendChild(hatG);

  // Shiny
  if(shiny){const sg=el('g',{});[{x:-1,y:3},{x:31,y:5},{x:-1,y:12},{x:31,y:16},{x:1,y:22},{x:30,y:25}].forEach(({x,y})=>sg.appendChild(el('rect',{x,y,width:'1',height:'1',fill:'#FFD700',opacity:'0.7'})));svg.appendChild(sg);}

  return svg;
}

function svgStr(svg){return new XMLSerializer().serializeToString(svg.cloneNode(true));}

// ═══════════════ UI ═══════════════
const box=document.getElementById('preview-box'),out=document.getElementById('svg-output'),msg=document.getElementById('copied-msg');
const sel=id=>document.getElementById('sel-'+id).value;
function update(){
  box.innerHTML='';
  box.appendChild(build(sel('breed'),sel('eye'),sel('ear'),sel('hat'),sel('palette'),document.getElementById('sel-shiny').checked));
  out.value=svgStr(box.firstChild);
}
['breed','eye','ear','hat','palette'].forEach(id=>document.getElementById('sel-'+id).addEventListener('change',update));
document.getElementById('sel-shiny').addEventListener('change',update);

function randomize(){
  const pk=a=>a[Math.floor(Math.random()*a.length)];
  document.getElementById('sel-breed').value=pk(['orange_tabby','tuxedo','calico','siamese','black_cat','ragdoll','scottish_fold']);
  document.getElementById('sel-eye').value=pk(['dot','sparkle','big','round','heart','star']);
  document.getElementById('sel-ear').value=pk(['cat','rabbit','mix']);
  document.getElementById('sel-hat').value=pk(['none','crown','tophat','propeller','halo','wizard','beanie','tinyduck']);
  document.getElementById('sel-palette').value=pk(['default','warm','cool','cream','charcoal','snow']);
  document.getElementById('sel-shiny').checked=Math.random()<0.1; update();
}
function copySVG(){navigator.clipboard.writeText(out.value).then(()=>{msg.classList.add('show');setTimeout(()=>msg.classList.remove('show'),2000);});}

update();
</script>

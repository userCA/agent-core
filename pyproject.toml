[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "0.1.0"
description = "General-purpose Python agent framework with streaming, tools, and persistence."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pathspec>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
mongo     = ["motor>=3.4"]
mem0      = ["mem0ai>=2.0"]
openviking = ["openviking>=0.3"]
mcp       = ["mcp>=1.0"]
openai    = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
test      = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.20"]
feishu    = ["lark-oapi>=1.6"]
otel      = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]
all       = ["motor>=3.4","mem0ai>=2.0","openviking>=0.3","mcp>=1.0","openai>=1.40","anthropic>=0.34","lark-oapi>=1.6","opentelemetry-api>=1.27","opentelemetry-sdk>=1.27","opentelemetry-exporter-otlp-proto-http>=1.27","opentelemetry-exporter-otlp-proto-grpc>=1.27"]

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

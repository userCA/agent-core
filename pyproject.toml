[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-core"
version = "0.1.0"
description = "General-purpose Python agent framework with streaming, tools, and persistence."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
mongo     = ["motor>=3.4"]
mcp       = ["mcp>=1.0"]
openai    = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
test      = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.20"]
all       = ["motor>=3.4","mcp>=1.0","openai>=1.40","anthropic>=0.34"]

[tool.hatch.build.targets.wheel]
packages = ["agent_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lottie 动画预览</title>
<style>
  :root { --bg: #faf8f5; --ink: #1a1a1a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
  }
  header {
    text-align: center; padding: 32px 20px 16px;
    border-bottom: 1px solid #e0ddd8;
  }
  header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  header p  { font-size: 13px; color: #999; }
  .grid { display: flex; gap: 0; }
  .col {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 28px 16px 36px;
  }
  .col + .col { border-left: 1px solid #e0ddd8; }
  .col-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.08em; color: #999;
    padding: 2px 12px; border-radius: 99px; border: 1px solid #e0ddd8;
    margin-bottom: 20px; background: var(--bg);
  }
  .lottie-box { width: 180px; height: 180px; margin-bottom: 12px; }
  .desc {
    font-size: 12px; color: #aaa; text-align: center;
    max-width: 200px; line-height: 1.5;
  }
  .note {
    text-align: center; padding: 20px; font-size: 12px; color: #aaa;
    border-top: 1px solid #e0ddd8; line-height: 1.8;
  }
  .note a { color: var(--ink); }
</style>
</head>
<body>

<header>
  <h1>Lottie 角色动画预览</h1>
  <p>lottie-web CDN + 内嵌极简动画数据验证渲染链路</p>
</header>

<div class="grid">
  <div class="col">
    <span class="col-label">弹跳球（验证渲染）</span>
    <div class="lottie-box" id="box-1"></div>
    <p class="desc">如果这个能看到 → CDN + 渲染正常<br>如果看不到 → CDN 被墙</p>
  </div>
  <div class="col">
    <span class="col-label">心跳</span>
    <div class="lottie-box" id="box-2"></div>
    <p class="desc">scale 弹性缩放循环<br>类似伴侣的 mood 切换</p>
  </div>
  <div class="col">
    <span class="col-label">眨眼</span>
    <div class="lottie-box" id="box-3"></div>
    <p class="desc">眼睛缩放 blink 循环<br>类似伴侣的眼睛动画</p>
  </div>
</div>

<div class="note">
  <strong>Lottie 工作流：</strong>设计师 AE 导出 → .json 文件 → lottie-web 播放 → Web / iOS / Android 通用<br>
  浏览免费动画：<a href="https://lottiefiles.com/search?q=cat" target="_blank">lottiefiles.com</a>
</div>

function tryLoad(id, data) {
  setTimeout(function() {
    var el = document.getElementById(id);
    if (!el) return;
    if (typeof lottie === 'undefined') {
      el.innerHTML = '<p style="color:#c33;font-size:12px">CDN 加载失败</p>';
      return;
    }
    try {
      lottie.loadAnimation({
        container: el,
        renderer: 'svg',
        loop: true,
        autoplay: true,
        animationData: data,
      });
      console.log(id + ' loaded');
    } catch(e) {
      el.innerHTML = '<p style="color:#c33;font-size:12px">渲染失败: ' + e.message + '</p>';
    }
  }, 200);
}
